services:

  chat-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chatApp

    ports:
      - "9000:9000"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      mongo_db:
        condition: service_healthy



  mongo_db:
    container_name: chatAppStorage
    image: mongo:7.0.5

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: chatAppDB

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/chatAppDB --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
